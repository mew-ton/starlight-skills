name: "Setup Node.js & pnpm"
description: "Sets up pnpm, Node.js with caching, and installs dependencies"
runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v5.0.0
      with:
        version: 10.32.1

    - name: Setup Node.js
      uses: actions/setup-node@v6.3.0
      with:
        node-version-file: package.json
        cache: "pnpm"

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
