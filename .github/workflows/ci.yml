name: 🧪 CI Checks
run-name: 🧪 CI Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    name: 🎨 Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
      
      - name: Setup Environment
        uses: ./.github/actions/node-setup
      
      - name: Code Quality (Biome)
        run: pnpm exec biome ci .

  typecheck:
    name: 🛡️ Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
      
      - name: Setup Environment
        uses: ./.github/actions/node-setup

      - name: Typecheck
        run: pnpm run typecheck

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
      
      - name: Setup Environment
        uses: ./.github/actions/node-setup

      - name: Build
        run: pnpm run build
