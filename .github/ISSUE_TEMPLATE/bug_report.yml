name: Bug Report
description: Create a report to help us improve starlight-skills
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: How can we reproduce this? A minimal Astro reproduction repository is highly appreciated.
      placeholder: |
        1. Install starlight-skills
        2. Configure `astro.config.ts` ...
        3. Run `next build` ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of starlight-skills are you using?
      placeholder: "e.g., 0.1.0"
  - type: textarea
    id: environment
    attributes:
      label: System Environment
      description: OS version, Node.js version, Astro version, etc.
      placeholder: "Node 20, macOS, Astro 4.x"
